workflows:
  ios-workflow:
    name: NAA TV Telugu iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build iOS Application & Package IPA
        script: |
          set -e
          cd ios
          echo "=== 1. Inspecting Xcode Scheme ==="
          xcodebuild -list -project NaaTvTelugu.xcodeproj
          
          echo "=== 2. Compiling NaaTvTelugu for iOS ==="
          xcodebuild build \
            -project NaaTvTelugu.xcodeproj \
            -scheme NaaTvTelugu \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          echo "=== 3. Locating Compiled .app ==="
          mkdir -p build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NaaTvTelugu.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "NaaTvTelugu.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          
          echo "=== 4. Packaging into .ipa ==="
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r NaaTvTelugu-Release.ipa Payload
          cp NaaTvTelugu-Release.ipa ../NaaTvTelugu-Release.ipa
          echo "Successfully packaged NaaTvTelugu-Release.ipa"
          ls -lh NaaTvTelugu-Release.ipa

    artifacts:
      - ios/build/*.ipa
      - "ios/*.ipa"
      - "*.ipa"
      - "**/NaaTvTelugu-Release.ipa"

    publishing:
      email:
        recipients:
          - madhusudhanvakkalanka2002vms@gmail.com
        notify:
          success: true
          failure: true
