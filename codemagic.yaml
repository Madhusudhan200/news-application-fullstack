workflows:
  ios-workflow:
    name: NAA TV Telugu iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build iOS Application & Package IPA
        script: |
          set -e
          XCODE_PROJ=$(find . -name "NaaTvTelugu.xcodeproj" -not -path "*/.*" | head -n 1)
          PROJ_DIR=$(dirname "$XCODE_PROJ")
          echo "Found project at: $XCODE_PROJ in directory $PROJ_DIR"
          cd "$PROJ_DIR"
          
          echo "Listing schemes in NaaTvTelugu.xcodeproj:"
          xcodebuild -list -project NaaTvTelugu.xcodeproj
          
          echo "Building NaaTvTelugu with archive..."
          xcodebuild archive \
            -project NaaTvTelugu.xcodeproj \
            -scheme NaaTvTelugu \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/NaaTvTelugu.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || \
          xcodebuild build \
            -project NaaTvTelugu.xcodeproj \
            -scheme NaaTvTelugu \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "Packaging .ipa payload..."
          mkdir -p build/Payload
          APP_PATH=$(find build -name "NaaTvTelugu.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NaaTvTelugu.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r NaaTvTelugu-Release.ipa Payload
          echo "Successfully created NaaTvTelugu-Release.ipa"
          ls -la NaaTvTelugu-Release.ipa

    artifacts:
      - "**/build/*.ipa"
      - "**/NaaTvTelugu-Release.ipa"
      - "*.ipa"

    publishing:
      email:
        recipients:
          - madhusudhanvakkalanka2002vms@gmail.com
        notify:
          success: true
          failure: true
