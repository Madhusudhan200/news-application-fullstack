name: Build iOS Application (NAA TV Telugu)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build iOS Application (Simulator & Device Slice)
        working-directory: NaaTvTelugu-iOS
        run: |
          xcodebuild -project NaaTvTelugu.xcodeproj \
            -scheme NaaTvTelugu \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa Payload
        working-directory: NaaTvTelugu-iOS
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "NaaTvTelugu.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r NaaTvTelugu-Release.ipa Payload
          echo "Created NaaTvTelugu-Release.ipa"

      - name: Upload iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: NaaTvTelugu-iOS-Release-ipa
          path: NaaTvTelugu-iOS/build/NaaTvTelugu-Release.ipa
          retention-days: 14
